# Self-host the Tessera dashboard on your own server + domain.
#
#   1. Point your domain's DNS A record at this server's public IP.
#   2. SITE_ADDRESS=tessera.example.com docker compose up -d --build
#
# Caddy terminates TLS (auto Let's Encrypt) and proxies to the app; the app
# itself stays internal. See docs/SELF_HOST.md for the full walkthrough.
services:
  tessera:
    build: .
    environment:
      - PORT=8787
      # Live on Arc: the agent runs the scenario against the deployed contracts
      # in real USDC. Set these in a .env file next to this compose file.
      - AGENT_PRIVATE_KEY=${AGENT_PRIVATE_KEY:-}
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY:-}
      # Owner key. REQUIRED for App Config to reach the contracts and for
      # "Allocate now" — the deployer owns the vault and the fee collector, so
      # without this the server can only save config locally.
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY:-}
      - ARC_RPC_URL=${ARC_RPC_URL:-https://rpc.testnet.arc.network}
      # Where runtime state lives. This MUST match the volume mounted below:
      # without it STATE_DIR falls back to the app root, which is inside the
      # image — so every `up --build` reset the admin password to the env seed
      # and lost the config, profiles, transaction history and holder index.
      - STATE_DIR=/app/state
      - ARC_CHAIN_ID=${ARC_CHAIN_ID:-}
      - ARC_EXPLORER_URL=${ARC_EXPLORER_URL:-}
      # Dashboard admin login (secret — set in a .env next to this file). Blank = disabled.
      - ADMIN_ID=${ADMIN_ID:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional: programmatic testnet USDC drips.
      - CIRCLE_API_KEY=${CIRCLE_API_KEY:-}
      # Optional LLM brain:
      - AGENT_BRAIN=${AGENT_BRAIN:-rules}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Live deployment record + persisted admin/config/profile state, so a
      # redeploy or a container rebuild doesn't lose them.
      - ./deployments:/app/deployments
      - tessera_state:/app/state   # STATE_DIR above points here
    expose:
      - "8787"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - tessera
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?Set SITE_ADDRESS to your domain, e.g. tessera.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  tessera_state:
