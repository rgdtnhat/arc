# Self-host the Tessera dashboard on your own server + domain.
#
#   1. Point your domain's DNS A record at this server's public IP.
#   2. SITE_ADDRESS=tessera.example.com docker compose up -d --build
#
# Caddy terminates TLS (auto Let's Encrypt) and proxies to the app; the app
# itself stays internal. See docs/SELF_HOST.md for the full walkthrough.
services:
  tessera:
    build: .
    #
    # The whole .env goes into the container, rather than a hand-kept list.
    #
    # This used to name each variable it passed through, which meant the
    # container only ever saw the dozen somebody had remembered to add. Setting
    # anything newer in .env did nothing at all, and nothing said so: the app
    # started fine and simply behaved as though the value were unset. That is
    # how a SESSION_KEY_PRIVATE_KEY sitting correctly in .env still produced
    # "no session key configured on this server" on the live site, and the same
    # silence covered the emissions guard, the autopilot, the keeper, the fee
    # harvester, the task runner and every RPC tuning knob.
    #
    # `required: false` so a host with no .env still starts — the quick-start in
    # docs/SELF_HOST.md passes SITE_ADDRESS inline and never writes one.
    # (Needs Compose v2.24+; older versions reject the mapping form.)
    env_file:
      - path: .env
        required: false
    # Only what the *container* fixes, or defaults for a .env that omits them.
    # Secrets are deliberately not repeated here: an `environment` entry wins
    # over env_file, and it is interpolated — so a password containing `$`
    # arrives mangled through this path and intact through the other.
    environment:
      - PORT=8787
      # Where runtime state lives. This MUST match the volume mounted below:
      # without it STATE_DIR falls back to the app root, which is inside the
      # image — so every `up --build` reset the admin password to the env seed
      # and lost the config, profiles, transaction history and holder index.
      - STATE_DIR=/app/state
      - ARC_RPC_URL=${ARC_RPC_URL:-https://rpc.testnet.arc.network}
      - ADMIN_ID=${ADMIN_ID:-admin}
      - AGENT_BRAIN=${AGENT_BRAIN:-rules}
    volumes:
      # Live deployment record + persisted admin/config/profile state, so a
      # redeploy or a container rebuild doesn't lose them.
      - ./deployments:/app/deployments
      - tessera_state:/app/state   # STATE_DIR above points here
    expose:
      - "8787"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - tessera
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?Set SITE_ADDRESS to your domain, e.g. tessera.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  tessera_state:
