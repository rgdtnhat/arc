name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract tests (Hardhat)
        run: npm test --workspace contracts

      - name: Agent unit tests (decision engine, guardian, memory)
        run: npm test --workspace agent

      - name: End-to-end demo (local chain, full agentic flow, one-shot)
        run: TESSERA_ONCE=1 AGENT_BRAIN=rules npx tsx agent/src/demo.ts
