# One-click deploy of the Tessera live dashboard to Render.
# In the Render dashboard: New → Blueprint → point at this repo. Render reads
# this file, builds the Dockerfile, and serves the dashboard at a public URL.
services:
  - type: web
    name: tessera-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # a small paid instance; ~512MB–1GB RAM
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8787"
      # Live on Arc testnet: supply funded wallet keys + the deployed addresses.
      # - key: AGENT_PRIVATE_KEY
      #   sync: false
      # - key: PROVIDER_PRIVATE_KEY
      #   sync: false
      # - key: ARC_RPC_URL
      #   value: https://rpc.testnet.arc.network
      # Optional: set to enable the LLM decision brain.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: AGENT_BRAIN
      #   value: llm
